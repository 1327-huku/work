<style>
:root{
  --bg1:#eef1ff;--bg2:#f7f0ff;--card:rgba(255,255,255,.78);--text:#1d2040;--muted:#6b7090;
  --line:rgba(90,100,200,.15);--accent:#5b6cff;--accent2:#22d3ee;--danger:#ef4444;--ok:#22c55e;
  --shadow:0 8px 30px rgba(70,80,180,.12);
}
:root[data-theme="dark"]{
  --bg1:#0e1024;--bg2:#1a1038;--card:rgba(30,33,64,.78);--text:#eef0ff;--muted:#9aa0c8;
  --line:rgba(150,160,255,.18);--shadow:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color:var(--text);min-height:100vh;
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.top{max-width:560px;margin:0 auto;padding:18px 16px 6px;display:flex;justify-content:space-between;align-items:center}
.top h1{margin:0;font-size:26px;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:13px;color:var(--muted)}
.icon-btn{border:0;background:var(--card);width:42px;height:42px;border-radius:14px;font-size:20px;box-shadow:var(--shadow)}
main{max-width:560px;margin:0 auto;padding:8px 16px}
.view{display:none;animation:fade .25s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:16px;margin:0 0 12px}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.section-head h2{margin:0}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
.center{text-align:center;justify-content:center}

/* hero */
.hero{display:flex;gap:16px;align-items:center}
.ring-wrap{position:relative;width:130px;height:130px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring-bg{stroke:var(--line)}
.ring-fg{stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-text b{font-size:28px}
.ring-text small{font-size:11px;color:var(--muted)}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.stat{background:var(--line);border-radius:14px;padding:8px 10px}
.stat span{font-size:19px;font-weight:700;display:block}
.stat small{font-size:11px;color:var(--muted)}

/* next deadlines */
.next{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.next:last-child{border:0}
.next .t{flex:1;min-width:0}
.next .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.next .t small{color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--line);white-space:nowrap}
.badge.late{background:#ef444422;color:var(--danger)}
.badge.soon{background:#f59e0b22;color:#d97706}
.badge.ok{background:#22c55e22;color:#16a34a}

/* subject cards */
.subj{--c:#5b6cff;border-left:6px solid var(--c)}
.subj-head{display:flex;align-items:center;gap:10px}
.subj-head .emoji{font-size:26px}
.subj-head .name{flex:1;font-weight:700}
.subj-head .pct{font-weight:800;color:var(--c)}
.bar{height:12px;border-radius:99px;background:var(--line);margin:12px 0 10px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,white));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.subj-foot{display:flex;align-items:center;gap:8px}
.subj-foot .cnt{flex:1;font-size:13px;color:var(--muted)}
.step{border:0;background:var(--line);color:var(--text);width:38px;height:38px;border-radius:12px;font-size:20px;font-weight:700}
.step.plus{background:var(--c);color:#fff}
.step:active{transform:scale(.92)}

/* chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.col .b{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:4px;transition:height .5s}
.col .n{font-size:11px;font-weight:700}
.col small{font-size:11px;color:var(--muted)}
.col.today small{color:var(--accent);font-weight:800}

/* forms */
.form{display:flex;flex-direction:column;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:stretch}
.row>*{flex:1;min-width:0}
input,select,button{font:inherit}
input[type=text],input[type=date],input[type=number],input[type=search],select{
  width:100%;padding:11px 12px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:3px}
.search{margin-bottom:12px}
button.primary{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(90deg,var(--accent),#8b5cff);color:#fff;font-weight:700;font-size:16px}
button.ghost{border:1px solid var(--line);border-radius:12px;padding:11px 16px;background:transparent;color:var(--text);font-size:16px}
button.danger{border:0;border-radius:12px;padding:11px 16px;background:#ef444420;color:var(--danger);font-size:16px;font-weight:700}
.chip{border:0;border-radius:99px;padding:7px 12px;background:var(--card);color:var(--accent);font-weight:700;font-size:13px;box-shadow:var(--shadow)}
button:active{transform:scale(.97)}

/* tasks */
.filters{display:flex;gap:10px;margin-bottom:10px}
.filters select{flex:1}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--line);flex:1.4}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.tasks{list-style:none;margin:0;padding:0}
.task{--c:#5b6cff;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--c);flex:none;position:relative;margin:0}
.task input[type=checkbox]:checked{background:var(--c)}
.task input[type=checkbox]:checked::after{content:"✓";color:#fff;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800}
.task .body{flex:1;min-width:0}
.task .title{font-weight:600;word-break:break-word}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:12px;color:var(--muted)}
.task .del{border:0;background:transparent;font-size:18px;opacity:.6}
.empty{text-align:center;color:var(--muted);padding:30px 10px;line-height:1.8}

/* timer */
.timer{text-align:center}
.timer select{margin-bottom:6px}
.timer-face{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;margin:14px 0 2px;letter-spacing:2px}
.timer-mode{color:var(--muted);margin-bottom:14px}
.row.small{margin-top:14px;font-size:13px;color:var(--muted)}
.row.small input{width:64px;display:inline-block;padding:6px}
.fstat{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}
.fstat .bar{flex:1;margin:0;height:10px}
.fstat b{min-width:56px;text-align:right}

/* tabbar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(540px,calc(100% - 24px));
  display:flex;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow);z-index:20}
.tabbar button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:20px}
.tabbar button.on{background:linear-gradient(135deg,var(--accent),#8b5cff);color:#fff;font-weight:700}

/* dialog / toast */
dialog{border:0;border-radius:22px;padding:18px;width:min(92vw,420px);background:var(--bg1);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,10,30,.5);backdrop-filter:blur(3px)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1d2040;color:#fff;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-size:14px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:380px){.hero{flex-direction:column}}

</style>
</head>
<body>
<canvas id="confetti"></canvas>

<header class="top">
  <div>
    <div class="eyebrow" id="greet">こんにちは</div>
    <h1>StudyQuest</h1>
  </div>
  <button class="icon-btn" data-action="toggle-theme" aria-label="テーマ切替">🌓</button>
</header>

<main>
  <!-- ホーム -->
  <section id="view-home" class="view active">
    <div class="card hero">
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120" class="ring">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="52" class="ring-bg"/>
          <circle cx="60" cy="60" r="52" class="ring-fg" id="ringFg" stroke="url(#g)"/>
        </svg>
        <div class="ring-text"><b id="ringPct">0%</b><small>全体の進捗</small></div>
      </div>
      <div class="hero-stats">
        <div class="stat"><span id="stStreak">0</span><small>🔥 連続日数</small></div>
        <div class="stat"><span id="stTasks">0/0</span><small>✅ 課題</small></div>
        <div class="stat"><span id="stToday">0</span><small>⚡ 今日の成果</small></div>
        <div class="stat"><span id="stFocus">0</span><small>⏱ 今日の集中(分)</small></div>
      </div>
    </div>

    <div class="card" id="nextCard">
      <h2>📅 次の締切</h2>
      <div id="nextList"></div>
    </div>

    <div class="section-head"><h2>教科ごとの進捗</h2><button class="chip" data-action="add-subject">＋ 教科を追加</button></div>
    <div id="subjects"></div>

    <div class="card">
      <h2>📈 この7日間の活動</h2>
      <div class="chart" id="chart"></div>
    </div>
  </section>

  <!-- 課題 -->
  <section id="view-tasks" class="view">
    <form id="taskForm" class="card form">
      <h2>＋ 課題を追加</h2>
      <input type="text" id="tTitle" placeholder="例:プライム p.12〜15" required maxlength="80">
      <div class="row">
        <select id="tSubject"></select>
        <input type="date" id="tDue">
      </div>
      <div class="row">
        <select id="tPrio">
          <option value="2">優先度:高 🔴</option>
          <option value="1" selected>優先度:中 🟡</option>
          <option value="0">優先度:低 🟢</option>
        </select>
        <button class="primary">追加</button>
      </div>
    </form>

    <div class="filters">
      <div class="seg" id="fStatus">
        <button data-f="all" class="on">すべて</button>
        <button data-f="todo">未完了</button>
        <button data-f="done">完了</button>
      </div>
      <select id="fSubject"></select>
    </div>
    <input type="search" id="fSearch" class="search" placeholder="🔍 課題を検索">
    <ul id="taskList" class="tasks"></ul>
  </section>

  <!-- タイマー -->
  <section id="view-timer" class="view">
    <div class="card timer">
      <h2>⏱ 集中タイマー</h2>
      <select id="timerSubject"></select>
      <div class="timer-face" id="timerFace">25:00</div>
      <div class="timer-mode" id="timerMode">集中モード</div>
      <div class="row center">
        <button class="primary" data-action="timer-toggle" id="timerBtn">スタート</button>
        <button class="ghost" data-action="timer-reset">リセット</button>
      </div>
      <div class="row center small">
        <label>集中 <input type="number" id="workMin" min="1" max="120" value="25"> 分</label>
        <label>休憩 <input type="number" id="restMin" min="1" max="60" value="5"> 分</label>
      </div>
    </div>
    <div class="card">
      <h2>教科別の集中時間(累計)</h2>
      <div id="focusStats"></div>
    </div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" class="view">
    <div class="card form">
      <h2>⚙️ 設定</h2>
      <label>名前(あいさつに使います)<input type="text" id="sName" maxlength="20" placeholder="例:たろう"></label>
      <label>テーマ
        <select id="sTheme">
          <option value="auto">自動</option>
          <option value="light">ライト</option>
          <option value="dark">ダーク</option>
        </select>
      </label>
    </div>
    <div class="card form">
      <h2>💾 バックアップ</h2>
      <p class="muted">データはこの端末のブラウザに保存されています。兄弟で共有・引っ越しするときは書き出して読み込みます。</p>
      <div class="row">
        <button class="ghost" data-action="export">書き出し</button>
        <button class="ghost" data-action="import">読み込み</button>
      </div>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="danger" data-action="reset">全データを消去</button>
    </div>
    <p class="muted center">StudyQuest v1.0</p>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="home" class="on"><span>🏠</span>ホーム</button>
  <button data-tab="tasks"><span>📝</span>課題</button>
  <button data-tab="timer"><span>⏱</span>タイマー</button>
  <button data-tab="settings"><span>⚙️</span>設定</button>
</nav>

<dialog id="subjectDialog">
  <form method="dialog" id="subjectForm" class="form">
    <h2 id="sdTitle">教科を編集</h2>
    <label>名前<input type="text" id="sdName" required maxlength="20"></label>
    <div class="row">
      <label>絵文字<input type="text" id="sdEmoji" maxlength="2"></label>
      <label>色<input type="color" id="sdColor"></label>
    </div>
    <div class="row">
      <label>単位(ページ・枚・問など)<input type="text" id="sdUnit" maxlength="6"></label>
      <label>全体の量<input type="number" id="sdTotal" min="1" max="9999"></label>
    </div>
    <label>終わった量<input type="number" id="sdDone" min="0" max="9999"></label>
    <div class="row">
      <button type="button" class="danger" id="sdDelete">削除</button>
      <button type="button" class="ghost" id="sdCancel">閉じる</button>
      <button class="primary" id="sdSave">保存</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast"></div>

<script>
// データの保存・読み込み(ブラウザのlocalStorage)
const KEY = 'studyquest.v1';

const uid = () => Math.random().toString(36).slice(2, 9);

function todayStr(d = new Date()) {
  const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 10);
}

function defaults() {
  return {
    name: '',
    theme: 'auto',
    focus: { work: 25, rest: 5 },
    subjects: [
      { id: 'prime', name: 'プライム', emoji: '📘', color: '#5b6cff', unit: 'ページ', total: 10, done: 0 },
      { id: 'kobun', name: 'プログレス古文', emoji: '📜', color: '#f97316', unit: '回', total: 10, done: 0 },
      { id: 'kanbun', name: 'プログレス漢文', emoji: '🈴', color: '#14b8a6', unit: '回', total: 10, done: 0 },
      { id: 'math', name: '土曜課外 数学プリント', emoji: '➗', color: '#a855f7', unit: '枚', total: 10, done: 0 }
    ],
    tasks: [],
    log: [] // { d:'2026-11-24', t:'task'|'unit'|'focus', n:数, s:教科id }
  };
}

const Store = {
  load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaults();
      return Object.assign(defaults(), JSON.parse(raw));
    } catch (e) {
      return defaults();
    }
  },
  save(state) {
    try {
      state.log = state.log.slice(-1500);
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('保存できませんでした', e);
    }
  },
  clear() {
    try { localStorage.removeItem(KEY); } catch (e) {}
  }
};

// かんたん紙吹雪
const Confetti = (() => {
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  let parts = [], running = false;
  const colors = ['#5b6cff', '#22d3ee', '#f97316', '#a855f7', '#22c55e', '#facc15', '#f43f5e'];

  function resize() {
    cv.width = innerWidth * devicePixelRatio;
    cv.height = innerHeight * devicePixelRatio;
  }
  addEventListener('resize', resize);
  resize();

  function burst(count = 90) {
    const dpr = devicePixelRatio;
    for (let i = 0; i < count; i++) {
      parts.push({
        x: cv.width / 2, y: cv.height * 0.35,
        vx: (Math.random() - 0.5) * 14 * dpr,
        vy: (Math.random() * -12 - 4) * dpr,
        g: 0.35 * dpr, s: (Math.random() * 7 + 4) * dpr,
        r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
        c: colors[(Math.random() * colors.length) | 0], life: 110
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    parts = parts.filter(p => p.life > 0);
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  return { burst };
})();

// StudyQuest メインスクリプト
let S = Store.load();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const subj = (id) => S.subjects.find(s => s.id === id);
const save = () => { Store.save(S); render(); };

function logAdd(t, n, s) { S.log.push({ d: todayStr(), t, n, s }); }

function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function daysUntil(dateStr) {
  const a = new Date(todayStr() + 'T00:00:00');
  const b = new Date(dateStr + 'T00:00:00');
  return Math.round((b - a) / 864e5);
}
function dueBadge(dateStr, done) {
  if (!dateStr) return '';
  const d = daysUntil(dateStr);
  if (done) return `<span class="badge ok">${dateStr.slice(5).replace('-', '/')}</span>`;
  if (d < 0) return `<span class="badge late">${-d}日超過</span>`;
  if (d === 0) return `<span class="badge late">今日まで</span>`;
  if (d === 1) return `<span class="badge soon">明日まで</span>`;
  if (d <= 3) return `<span class="badge soon">あと${d}日</span>`;
  return `<span class="badge">あと${d}日</span>`;
}

// ---------- テーマ ----------
function applyTheme() {
  const dark = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}

// ---------- ホーム ----------
function streak() {
  const days = new Set(S.log.map(l => l.d));
  let n = 0;
  const d = new Date();
  if (!days.has(todayStr(d))) d.setDate(d.getDate() - 1); // 今日まだなら昨日から数える
  while (days.has(todayStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function renderHome() {
  const h = new Date().getHours();
  const hello = h < 5 ? 'おつかれさま' : h < 11 ? 'おはよう' : h < 18 ? 'こんにちは' : 'こんばんは';
  $('greet').textContent = hello + (S.name ? '、' + S.name + 'さん' : '');

  const total = S.subjects.reduce((a, s) => a + s.total, 0);
  const done = S.subjects.reduce((a, s) => a + Math.min(s.done, s.total), 0);
  const pct = total ? Math.round(done / total * 100) : 0;
  $('ringPct').textContent = pct + '%';
  $('ringFg').style.strokeDashoffset = 326.7 * (1 - pct / 100);

  const td = todayStr();
  const tdone = S.tasks.filter(t => t.done).length;
  $('stStreak').textContent = streak() + '日';
  $('stTasks').textContent = `${tdone}/${S.tasks.length}`;
  $('stToday').textContent = S.log.filter(l => l.d === td && l.t !== 'focus').reduce((a, l) => a + l.n, 0);
  $('stFocus').textContent = S.log.filter(l => l.d === td && l.t === 'focus').reduce((a, l) => a + l.n, 0);

  // 次の締切
  const next = S.tasks.filter(t => !t.done && t.due).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 4);
  $('nextList').innerHTML = next.length ? next.map(t => {
    const s = subj(t.subject);
    return `<div class="next"><span style="font-size:22px">${s ? esc(s.emoji) : '📝'}</span>
      <div class="t"><b>${esc(t.title)}</b><small>${s ? esc(s.name) : ''}</small></div>${dueBadge(t.due)}</div>`;
  }).join('') : '<p class="muted">締切のある未完了の課題はありません 🎉</p>';

  // 教科カード
  $('subjects').innerHTML = S.subjects.map(s => {
    const p = s.total ? Math.round(Math.min(s.done, s.total) / s.total * 100) : 0;
    return `<div class="card subj" style="--c:${esc(s.color)}">
      <div class="subj-head"><span class="emoji">${esc(s.emoji)}</span><span class="name">${esc(s.name)}</span><span class="pct">${p}%</span>
        <button class="chip" data-action="edit-subject" data-id="${s.id}">編集</button></div>
      <div class="bar"><i style="width:${p}%"></i></div>
      <div class="subj-foot"><span class="cnt">${s.done} / ${s.total} ${esc(s.unit)}${p >= 100 ? ' 🎉 完了!' : ''}</span>
        <button class="step" data-action="dec" data-id="${s.id}">−</button>
        <button class="step plus" data-action="inc" data-id="${s.id}">＋</button></div>
    </div>`;
  }).join('') || '<p class="muted">教科がありません。「＋ 教科を追加」から作成してください。</p>';

  // 7日間グラフ
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const vals = days.map(d => S.log.filter(l => l.d === todayStr(d) && l.t !== 'focus').reduce((a, l) => a + l.n, 0));
  const max = Math.max(1, ...vals);
  const wd = ['日', '月', '火', '水', '木', '金', '土'];
  $('chart').innerHTML = days.map((d, i) =>
    `<div class="col ${i === 6 ? 'today' : ''}"><span class="n">${vals[i] || ''}</span>
     <div class="b" style="height:${vals[i] / max * 85}%"></div><small>${wd[d.getDay()]}</small></div>`).join('');
}

// ---------- 課題 ----------
let filt = { status: 'all', subject: 'all', q: '' };

function fillSubjectSelects() {
  const opts = S.subjects.map(s => `<option value="${s.id}">${esc(s.emoji)} ${esc(s.name)}</option>`).join('');
  const cur = { t: $('tSubject').value, f: $('fSubject').value, m: $('timerSubject').value };
  $('tSubject').innerHTML = opts;
  $('fSubject').innerHTML = '<option value="all">全教科</option>' + opts;
  $('timerSubject').innerHTML = opts;
  if (cur.t) $('tSubject').value = cur.t;
  $('fSubject').value = cur.f || 'all';
  if (cur.m) $('timerSubject').value = cur.m;
}

function renderTasks() {
  let list = S.tasks.filter(t =>
    (filt.status === 'all' || (filt.status === 'done') === t.done) &&
    (filt.subject === 'all' || t.subject === filt.subject) &&
    (!filt.q || t.title.toLowerCase().includes(filt.q.toLowerCase())));
  list.sort((a, b) => (a.done - b.done) || (a.due || '9999').localeCompare(b.due || '9999') || (b.prio - a.prio));
  $('taskList').innerHTML = list.length ? list.map(t => {
    const s = subj(t.subject);
    const pr = ['🟢', '🟡', '🔴'][t.prio] || '';
    return `<li class="task ${t.done ? 'done' : ''}" style="--c:${s ? esc(s.color) : '#5b6cff'}">
      <input type="checkbox" data-action="toggle" data-id="${t.id}" ${t.done ? 'checked' : ''} aria-label="完了">
      <div class="body"><div class="title">${esc(t.title)}</div>
        <div class="meta"><span>${s ? esc(s.emoji + ' ' + s.name) : ''}</span><span>${pr}</span>${dueBadge(t.due, t.done)}</div></div>
      <button class="del" data-action="del-task" data-id="${t.id}" aria-label="削除">🗑</button></li>`;
  }).join('') : '<li class="empty">課題がありません。<br>上のフォームから追加しましょう ✨</li>';
}

// ---------- タイマー ----------
const T = { mode: 'work', left: 25 * 60, end: 0, run: false, iv: null };

function fmt(sec) { return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }

function timerRender() {
  $('timerFace').textContent = fmt(T.left);
  $('timerMode').textContent = T.mode === 'work' ? '集中モード' : '休憩モード ☕';
  $('timerBtn').textContent = T.run ? '一時停止' : 'スタート';
  document.title = T.run ? `${fmt(T.left)} StudyQuest` : 'StudyQuest 課題トラッカー';
}

function timerReset(mode = 'work') {
  clearInterval(T.iv); T.run = false; T.mode = mode;
  T.left = (mode === 'work' ? S.focus.work : S.focus.rest) * 60;
  timerRender();
}

function timerTick() {
  T.left = Math.max(0, Math.round((T.end - Date.now()) / 1000));
  if (T.left <= 0) {
    const wasWork = T.mode === 'work';
    if (wasWork) { logAdd('focus', S.focus.work, $('timerSubject').value); Store.save(S); Confetti.burst(60); renderHome(); renderFocus(); }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    toast(wasWork ? `${S.focus.work}分おつかれさま!休憩しよう☕` : '休憩おわり!次いこう💪');
    timerReset(wasWork ? 'rest' : 'work');
    return;
  }
  timerRender();
}

function timerToggle() {
  if (T.run) { clearInterval(T.iv); T.run = false; timerRender(); return; }
  T.run = true; T.end = Date.now() + T.left * 1000;
  T.iv = setInterval(timerTick, 500);
  timerRender();
}

function renderFocus() {
  const sums = S.subjects.map(s => ({ s, m: S.log.filter(l => l.t === 'focus' && l.s === s.id).reduce((a, l) => a + l.n, 0) }));
  const max = Math.max(1, ...sums.map(x => x.m));
  $('focusStats').innerHTML = sums.map(x =>
    `<div class="fstat"><span>${esc(x.s.emoji)}</span><div class="bar" style="--c:${esc(x.s.color)}"><i style="width:${x.m / max * 100}%"></i></div><b>${x.m}分</b></div>`).join('');
}

// ---------- 教科の編集ダイアログ ----------
let editingId = null;
function openSubject(id) {
  editingId = id;
  const s = id ? subj(id) : { name: '', emoji: '📚', color: '#5b6cff', unit: 'ページ', total: 10, done: 0 };
  $('sdTitle').textContent = id ? '教科を編集' : '教科を追加';
  $('sdName').value = s.name; $('sdEmoji').value = s.emoji; $('sdColor').value = s.color;
  $('sdUnit').value = s.unit; $('sdTotal').value = s.total; $('sdDone').value = s.done;
  $('sdDelete').style.display = id ? '' : 'none';
  $('subjectDialog').showModal();
}

// ---------- 全体描画 ----------
function render() {
  applyTheme();
  fillSubjectSelects();
  renderHome();
  renderTasks();
  renderFocus();
  $('sName').value = S.name; $('sTheme').value = S.theme;
  $('workMin').value = S.focus.work; $('restMin').value = S.focus.rest;
  if (!T.run) timerReset(T.mode);
}

// ---------- イベント ----------
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b === tab));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab.dataset.tab));
    scrollTo({ top: 0 });
    return;
  }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'toggle-theme':
      S.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; save(); break;
    case 'inc': case 'dec': {
      const s = subj(id); const before = s.done;
      s.done = Math.max(0, Math.min(s.total, s.done + (el.dataset.action === 'inc' ? 1 : -1)));
      if (s.done > before) { logAdd('unit', 1, s.id); if (s.done === s.total) { Confetti.burst(160); toast(`${s.name} 完了!すごい🎉`); } }
      save(); break;
    }
    case 'edit-subject': openSubject(id); break;
    case 'add-subject': openSubject(null); break;
    case 'toggle': {
      const t = S.tasks.find(x => x.id === id); t.done = el.checked;
      if (t.done) { logAdd('task', 1, t.subject); Confetti.burst(40);
        if (S.tasks.every(x => x.done)) { Confetti.burst(160); toast('全課題クリア!最高🏆'); } }
      save(); break;
    }
    case 'del-task':
      if (confirm('この課題を削除しますか?')) { S.tasks = S.tasks.filter(x => x.id !== id); save(); } break;
    case 'timer-toggle': timerToggle(); break;
    case 'timer-reset': timerReset('work'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `studyquest-${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href); break;
    }
    case 'import': $('importFile').click(); break;
    case 'reset':
      if (confirm('本当に全データを消去しますか?元に戻せません。')) { Store.clear(); S = Store.load(); save(); toast('初期化しました'); } break;
  }
});

$('taskForm').addEventListener('submit', (e) => {
  e.preventDefault();
  S.tasks.push({ id: uid(), title: $('tTitle').value.trim(), subject: $('tSubject').value,
    due: $('tDue').value, prio: +$('tPrio').value, done: false });
  $('tTitle').value = '';
  save(); toast('追加しました ✅');
});

$('fStatus').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  filt.status = b.dataset.f;
  document.querySelectorAll('#fStatus button').forEach(x => x.classList.toggle('on', x === b));
  renderTasks();
});
$('fSubject').addEventListener('change', (e) => { filt.subject = e.target.value; renderTasks(); });
$('fSearch').addEventListener('input', (e) => { filt.q = e.target.value; renderTasks(); });

$('sName').addEventListener('change', (e) => { S.name = e.target.value.trim(); save(); });
$('sTheme').addEventListener('change', (e) => { S.theme = e.target.value; save(); });
$('workMin').addEventListener('change', (e) => { S.focus.work = Math.max(1, +e.target.value || 25); Store.save(S); if (!T.run) timerReset(T.mode); });
$('restMin').addEventListener('change', (e) => { S.focus.rest = Math.max(1, +e.target.value || 5); Store.save(S); if (!T.run) timerReset(T.mode); });

$('importFile').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data.subjects) || !Array.isArray(data.tasks)) throw new Error('形式が違います');
      S = Object.assign(defaults(), data); save(); toast('読み込みました ✅');
    } catch (err) { alert('読み込みに失敗しました:' + err.message); }
  };
  r.readAsText(f); e.target.value = '';
});

$('sdCancel').onclick = () => $('subjectDialog').close();
$('sdDelete').onclick = () => {
  if (confirm('この教科と、紐づく課題を削除しますか?')) {
    S.subjects = S.subjects.filter(s => s.id !== editingId);
    S.tasks = S.tasks.filter(t => t.subject !== editingId);
    $('subjectDialog').close(); save();
  }
};
$('subjectForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const total = Math.max(1, +$('sdTotal').value || 1);
  const data = { name: $('sdName').value.trim(), emoji: $('sdEmoji').value || '📚', color: $('sdColor').value,
    unit: $('sdUnit').value || '個', total, done: Math.max(0, Math.min(total, +$('sdDone').value || 0)) };
  if (editingId) Object.assign(subj(editingId), data); else S.subjects.push(Object.assign({ id: uid() }, data));
  $('subjectDialog').close(); save();
});

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

// 日付の初期値(今日)
$('tDue').min = todayStr();

render();

</script>
</body>
</html>
